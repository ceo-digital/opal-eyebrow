<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Opal Eyebrow — סטודיו יוקרתי לעיצוב גבות, הרמת גבות והרמת ריסים."
    />
    <title>Opal Eyebrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600&family=Noto+Serif+Hebrew:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('opal-a11y') || '{}')
        var scale = a.textScale != null ? a.textScale : a.largeText ? 1 : 0
        if (scale === 1) document.documentElement.classList.add('a11y-large')
        if (scale === 2) document.documentElement.classList.add('a11y-xlarge')
        if (a.contrast && !a.yellowBlack) document.documentElement.classList.add('a11y-contrast')
        if (a.yellowBlack) document.documentElement.classList.add('a11y-yellow')
        if (a.highlightLinks) document.documentElement.classList.add('a11y-links')
        if (a.highlightHeadings) document.documentElement.classList.add('a11y-headings')
        if (a.readableFont) document.documentElement.classList.add('a11y-readable')
        if (a.bigCursor) document.documentElement.classList.add('a11y-cursor')
        if (a.spacing) document.documentElement.classList.add('a11y-spacing')
        if (a.reduceMotion) document.documentElement.classList.add('a11y-reduce-motion')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
